name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Create Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Validate version in manifest
        run: |
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/firewalla/manifest.json'))['version'])")
          if [ "$MANIFEST_VERSION" != "${{ steps.get_version.outputs.VERSION }}" ]; then
            echo "Version mismatch: tag=${{ steps.get_version.outputs.VERSION }}, manifest=$MANIFEST_VERSION"
            exit 1
          fi

      - name: Create release archive
        run: |
          cd custom_components/firewalla
          zip -r ../../firewalla.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: firewalla.zip
          generate_release_notes: true
